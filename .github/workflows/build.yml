name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: gradle build --no-daemon --info 2>&1 | tee build-output.txt ; echo "EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Find all outputs
        if: always()
        run: |
          find . -name "*.jar" -not -path "./.gradle/*" > find-output.txt 2>&1
          ls -laR build/ >> find-output.txt 2>&1 || echo "build/ not found" >> find-output.txt
          tail -300 build-output.txt > build-tail.txt

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            build-tail.txt
            find-output.txt
          retention-days: 5

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: carpet-ai-fake-player-jar
          path: build/libs/
          retention-days: 30
