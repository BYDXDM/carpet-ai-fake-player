name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        id: gradle-build
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build-output.txt ; echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Find JAR files
        if: always()
        run: |
          echo "=== 查找 JAR 文件 ==="
          find . -name "*.jar" -type f 2>/dev/null
          echo "=== build 目录内容 ==="
          ls -la build/ 2>/dev/null || echo "build/ 目录不存在"
          echo "=== build/libs 目录内容 ==="
          ls -la build/libs/ 2>/dev/null || echo "build/libs/ 目录不存在"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: carpet-ai-fake-player-jar
          path: build/libs/
          retention-days: 30
