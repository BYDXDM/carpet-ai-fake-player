name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        id: gradle-build
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build-output.txt ; echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Find JAR files
        if: always()
        run: |
          echo "## 查找结果" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== 查找所有 JAR 文件 ===" >> $GITHUB_STEP_SUMMARY
          find . -name "*.jar" -type f >> $GITHUB_STEP_SUMMARY 2>&1 || echo "没有找到 JAR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "=== build 目录内容 ===" >> $GITHUB_STEP_SUMMARY
          ls -la build/ >> $GITHUB_STEP_SUMMARY 2>&1 || echo "build/ 不存在" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "=== build/libs 目录内容 ===" >> $GITHUB_STEP_SUMMARY
          ls -la build/libs/ >> $GITHUB_STEP_SUMMARY 2>&1 || echo "build/libs/ 不存在" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: carpet-ai-fake-player-jar
          path: build/libs/
          retention-days: 30
