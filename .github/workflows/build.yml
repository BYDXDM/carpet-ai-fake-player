name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV
          exit $EXIT_CODE

      - name: Show build output on failure
        if: failure() || env.BUILD_EXIT_CODE != '0'
        run: tail -200 build-output.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: carpet-ai-fake-player-jar
          path: build/libs/*.jar
          retention-days: 30
