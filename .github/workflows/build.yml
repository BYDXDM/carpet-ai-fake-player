name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Gradle version
        run: gradle --version

      - name: Build with Gradle
        run: gradle build --no-daemon 2>&1

      - name: List all outputs
        id: list
        if: always()
        run: |
          JARS=$(find . -name "*.jar" -not -path "./.gradle/*" 2>/dev/null || echo "none")
          BUILD_TREE=$(ls -laR build/ 2>/dev/null || echo "build/ not found")
          TASKS=$(gradle tasks --all 2>&1 | grep -i "jar\|build\|assemble" || echo "no matching tasks")
          echo "jars<<EOF" >> $GITHUB_OUTPUT
          echo "$JARS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "build_tree<<EOF" >> $GITHUB_OUTPUT
          echo "$BUILD_TREE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "tasks<<EOF" >> $GITHUB_OUTPUT
          echo "$TASKS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Write debug info to summary
        if: always()
        run: |
          echo "## JARs found" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.list.outputs.jars }}" >> $GITHUB_STEP_SUMMARY
          echo "## Build tree" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.list.outputs.build_tree }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## Relevant tasks" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.list.outputs.tasks }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: carpet-ai-fake-player-jar
          path: build/libs/
          retention-days: 30
